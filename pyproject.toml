[project]
name = "trishuli-flood-response"
version = "0.1.0"
description = "Satellite-based flood damage assessment (Sentinel-1/2, Copernicus DEM, pre-event OSM)"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyyaml",
  "requests",
  "python-dotenv",
  "shapely>=2",
  "geopandas",
  "pandas",
  "pyproj",
  "rasterio",
  "scipy",
  "scikit-image",
  "matplotlib",
  "networkx",
  "fastapi",
  "uvicorn",
  "streamlit",
  "folium",
  "streamlit-folium",
  "weasyprint",
  "markdown",
  "httpx",
]

[project.optional-dependencies]
ml = ["torch", "segmentation-models-pytorch", "huggingface_hub"]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]
